<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none" role="img" aria-label="Zebracat AI Publicity logo mark">
  <defs>
    <!-- Silver outer legs: lighter on far edge, shadowed toward crimson -->
    <linearGradient id="sgL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D2D2D2"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>
    <linearGradient id="sgR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#909090"/>
      <stop offset="100%" stop-color="#D2D2D2"/>
    </linearGradient>
    <!-- Crimson legs: slight bevel, brighter on face side -->
    <linearGradient id="crL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A0000"/>
      <stop offset="55%" stop-color="#9B0000"/>
      <stop offset="100%" stop-color="#6B0000"/>
    </linearGradient>
    <linearGradient id="crR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B0000"/>
      <stop offset="45%" stop-color="#9B0000"/>
      <stop offset="100%" stop-color="#7A0000"/>
    </linearGradient>
    <!-- Crossbar: brighter centre -->
    <linearGradient id="cbG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#760000"/>
      <stop offset="50%" stop-color="#9B0000"/>
      <stop offset="100%" stop-color="#760000"/>
    </linearGradient>
    <!-- Orb: glossy sphere -->
    <radialGradient id="orbG" cx="38%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#7A3260"/>
      <stop offset="100%" stop-color="#200A16"/>
    </radialGradient>
  </defs>

  <!--
    Layer order (painter's algorithm, back → front):
    1. Silver outer legs  (back flanges)
    2. Crimson inner legs (front faces — overlap inner silver edge)
    3. Dark centre spine  (front centre)
    4. Crossbar + spine overlay
    5. Antenna + orb
  -->

  <!-- 1a. Silver outer — LEFT -->
  <polygon points="100,22  4,270  36,270  100,58" fill="url(#sgL)"/>

  <!-- 1b. Silver outer — RIGHT -->
  <polygon points="100,22  164,270  196,270  100,58" fill="url(#sgR)"/>

  <!-- 2a. Crimson leg — LEFT (covers inner silver edge) -->
  <polygon points="100,22  20,270  58,270  100,52" fill="url(#crL)"/>

  <!-- 2b. Crimson leg — RIGHT -->
  <polygon points="100,22  142,270  180,270  100,52" fill="url(#crR)"/>

  <!-- 3. Dark centre spine -->
  <polygon points="100,22  91,270  109,270" fill="#1A1A1A"/>

  <!--
    4. Crossbar at 60 % of leg height.
       Leg height = 270-22 = 248.  60% → y = 22 + 149 = 171.
       At y=171, left crimson outer edge:
         x = 20 + (100-20)*(270-171)/(270-22) = 20 + 80*99/248 ≈ 52
       Right crimson outer edge (symmetric): 148
  -->
  <polygon points="52,171  148,171  150,185  50,185" fill="url(#cbG)"/>

  <!-- Crossbar spine overlay (dark over crossbar) -->
  <polygon points="91,171  109,171  109,185  91,185" fill="#1A1A1A"/>

  <!-- 5a. Antenna stem -->
  <rect x="99" y="15" width="2" height="10" fill="#8B0000"/>

  <!-- 5b. Finial orb -->
  <circle cx="100" cy="10" r="9" fill="url(#orbG)"/>
  <!-- Specular highlight -->
  <ellipse cx="97" cy="7" rx="3" ry="2.2" fill="#A05080" opacity="0.45"/>
</svg>
